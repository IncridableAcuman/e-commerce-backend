server:
  port: 8080

spring:
  datasource:
    url: jdbc://postgresql://localhost:5432/commerce
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          auto: update
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDriver